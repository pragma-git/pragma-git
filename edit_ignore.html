<html>
    <head>
        <title>Git-ignore Editor</title>  <!-- NOTE : Don't edit title, without updating listChanged.js which uses this title to close this editor --> 
        <script src="ssh_folder/ssh-folder-lib.js"></script>
    
        <link rel="stylesheet" type="text/css" href="color_styles.css" />
        <link rel="stylesheet" type="text/css" href="settings.css" />
        <link rel="stylesheet" type="text/css" href="node_modules/css-spinners/dist/round/round.css" />
    </head>

    <style>
        body{
            font-family: Arial;
            font-size: 11pt;
            background: var(--body-background);
            color: var(--body-text);
        }
        
         
        #outer-content{
            margin: 20px;
        }


        textarea{
            /* width: 400; */
            line-height: 1;
            color: var(--body-text);
            border-width: thin;
            background-color: var(--input-background);
        }
        input{
            color: var(--body-text);
            border-width: thin;
            background-color: var(--input-background);
        }
        
        input, label {
            font-size: 9pt; 
            display:block;
        }

        a{
            color: var(--link-color);
        }
        
        .green{
            color: var(--green-text);
        }
        .red{
            color: var(--red-text);
        }
        
               
        img[src="images/warning.png"] 
        {
            filter: invert( 0% );
        }
        
    </style>

    <body id='body' class='light'>     
        <!-- Dark mode on/off , zoom --> 
        <script>
            var gui = require('nw.gui');
            var state = global.state;
            var localState = global.localState;
            var win;

            if (localState && localState.dark){
                document.body.classList.remove('light');
                document.body.classList.add('dark');
            }
            window.document.body.style.zoom = (state && state.zoom) || 1;
        </script>
        
        <!--  Add find  -->    
        <script src="node_modules/findinnw/dist/find-in-nw.js"></script>
        <script src="extend_find-in-nw.js"></script>
        <script>
            findInNw.initialize();
            extendFindInNw(); // Make find-in-nw fit my purpose for graph and note
        </script> 

    
        <!-- HTML -->       
        <div id="outer-content" style="width: auto;">        
            <div id="inner-content">
                
                
                <img id="find-icon" style='vertical-align:middle;float: right' height="17" width="17"  
                    onclick="findInNw.showSearchBox();" 
                    onmouseover="document.getElementById('find-icon').src='images/find_hover.png' " 
                    onmouseout="document.getElementById('find-icon').src='images/find_black.png' " 
                    src="images/find_black.png" >
                
                
                    
                <h2 id="header_Settings">.gitignore Editor
            
                <!-- HELP HERE -->
                <img id="about-icon" style='vertical-align:middle;float: right;position:relative; right: 20px' height="17" width="17"  
                    onclick="let evt = {}; evt.name='Git-ignore Editor';opener.opener._callback('help',evt);" 
                    onmouseover="document.getElementById('about-icon').src='images/questionmark_hover.png' " 
                    onmouseout="document.getElementById('about-icon').src='images/questionmark_black.png' " 
                    src="images/questionmark_black.png" >
                </h2>
                
                <hr>              
    
                <!--  busy spinner  --> 
                <div id="spinner" class="spin-round warning" style="left:45%; top:150px; visibility:collapse;"></div>
                
                <!--  .ignore file editor  --> 
                <div>
                    <label for="ignoreFile"> .gitignore file:</label>
                    <textarea id="ignoreFile" placeholder="Write ignore rules here" style="height:300px; font-family:monospace" oninput="displayIgnoreList()"></textarea><br><br>
                    
                    <!--  Button row -->                
                    <button style="float: right; margin-left: 20px" onclick="retrackGitIndex()"> 
                        Retrack <img height="12" width="12"  src="images/warning.png"> 
                    </button>

                    <button style="float: left; " onclick="resetGitIgnore()">Reset</button>  <br><br>
                     
                    <br>
                    <!-- Warning text -->                     
                    <div style="
                        border: thin;
                        border-style: dashed;
                        padding: 12px;
                    ">
                        <img height="15" width="15" src="images/warning.png"> 
                        Ignore rules do not apply to tracked files.
                        "Retrack" removes tracked files, and retrack them according to ignore rules.
                        "Retrack" may take a long time if there are large folders not being ignored.  
                    </div>

                    </div>
                    <BR>
                    <a href="https://github.com/github/gitignore" onclick="require('nw.gui').Shell.openExternal( this.href);return false;">
                    Click for .gitignore inspiration
                    </a>
                    
                </div>
                <br><br>
                
    
                <!--  Preview of ignore result  -->    
                <h2 id="header_Settings">Preview</h2>
                <hr>
                <div id="ignoredList" placeholder="Paste Github-account access token here" style="font-size: 13px;" >
                    
                </div>  
    
    
            </div>
        </div>
    
        <!-- Scripting -->     

    </body>

    <script>
    const fs = require('fs');
    const path = require('path');
    const os = require('os');
    const pathsep = path.sep;  // Os-dependent path separator

    // Determine repository folder and key
    const repoFolder = global.state.repos[global.state.repoNumber].localFolder;
    const isSsh = (typeof repoFolder === 'string' && repoFolder.startsWith('ssh:'));
    const repoKey = (global.state.repos[global.state.repoNumber] && global.state.repos[global.state.repoNumber].sshKey) || '';

    // Local file path where .gitignore content is read/written locally
    let localIgnorePath = '';
    const settingsDir = os.homedir() + pathsep + '.Pragma-git';
    const ignoreFileBackup = settingsDir + pathsep + '.gitignore.pragma-backup';

    // SimpleGit instance: use app's central simpleGit wrapper if available (which routes SSH URLs to ssh-git-client)
    const simpleGitDefault = require('./lib/simpleGitWithRetry.js');
    function simpleGit(target) {
        if (opener && opener.opener && typeof opener.opener.simpleGit === 'function') {
            return opener.opener.simpleGit(target);
        }
        if (opener && typeof opener.simpleGit === 'function') {
            return opener.simpleGit(target);
        }
        return simpleGitDefault(target);
    }

    <!--  On Load event-->        
    window.addEventListener( 'DOMContentLoaded',  async (event) => { 
        
            // Always on top
            win = gui.Window.get();
            win.setAlwaysOnTop( state.alwaysOnTop );
            
            const util = require('./util_module.js'); // Pragma-git common functions

            try {
                if (isSsh) {
                    // Over SSH: Ensure helper scripts are installed on remote server
                    if (opener && opener.opener && typeof opener.opener.setupSshServer === 'function') {
                        await opener.opener.setupSshServer();
                    } else if (opener && typeof opener.setupSshServer === 'function') {
                        await opener.setupSshServer();
                    }

                    // Check if .gitignore exists on the server
                    let remoteGitignoreUrl = repoFolder + '/.gitignore';
                    let remoteExists = await fs_existsSync(remoteGitignoreUrl, repoKey);

                    if (remoteExists) {
                        localIgnorePath = await sshGet(repoFolder, '.gitignore');
                    } else {
                        // Make sure temp directory exists and create empty local file
                        localIgnorePath = (typeof SSH_TEMP_FILE_LOCATION !== 'undefined' ? SSH_TEMP_FILE_LOCATION : (os.tmpdir() + pathsep + 'pragma-git-ssh-folders')) + pathsep + '.gitignore';
                        let tempDir = path.dirname(localIgnorePath);
                        if (!fs.existsSync(tempDir)) {
                            fs.mkdirSync(tempDir, { recursive: true });
                        }
                        fs.writeFileSync(localIgnorePath, '', 'utf8');
                    }
                } else {
                    localIgnorePath = path.join(repoFolder, '.gitignore');
                    if (!fs.existsSync(localIgnorePath)) {
                        fs.writeFileSync(localIgnorePath, '', 'utf8');
                    }
                }

                // Load .gitignore file into textarea directly from file
                let currentContent = '';
                try {
                    currentContent = fs.readFileSync(localIgnorePath, 'utf8');
                } catch (e) {
                    console.warn("Could not read .gitignore:", e);
                    currentContent = '';
                }
                document.getElementById('ignoreFile').value = currentContent;

                // Store backup of .gitignore file
                try {
                    if (!fs.existsSync(settingsDir)) {
                        fs.mkdirSync(settingsDir, { recursive: true });
                    }
                    fs.copyFileSync(localIgnorePath, ignoreFileBackup);
                } catch (err) {
                    console.warn("Error creating backup of .gitignore:", err);
                }

                // Reset staged files (make gitignore handle files that were staged)
                await simpleGit(repoFolder).reset([], (err, result) => {
                    if (err) console.warn('Reset staged files error:', err);
                });

                // Update preview list (without overwriting file)
                await displayIgnoreList();

            } catch (err) {
                console.error('Error loading .gitignore in edit_ignore:', err);
            }
            
            // Set window size to match content
            let outerEl = document.getElementById('outer-content');
            let bodyEl = document.getElementById('body');
            let padding = (outerEl && outerEl.style.padding) ? Number(outerEl.style.padding.replace('px','')) : 20;
            let dx = (outerEl ? outerEl.scrollWidth : 600) * ((global.state && global.state.zoom) || 1);
            let dy = 0.7 * (bodyEl ? bodyEl.scrollHeight : 800) * ((global.state && global.state.zoom) || 1);
            
            // Minimum width
            if (dx < 500)
                dx = 500;
                
            // Minimum height
            if (dy < 600)
                dy = 600;
            
            let hx = window.outerWidth - window.innerWidth;
            let hy = window.outerHeight - window.innerHeight;

        }
    );
    

    <!--  On Unload event-->     
    window.addEventListener('unload', async (event) => {
        console.log('edit_ignore.html :DOM fully unloaded -- maybe window closed ');
        await close();
    });
    
    <!--  Functions-->   
    async function resetGitIgnore(){    // Reset button -- Reset .gitignore to state when started editor
        console.log('RESET gitignore file');
        
        try {
            // Restore .gitignore file from backup
            if (fs.existsSync(ignoreFileBackup)) {
                fs.copyFileSync(ignoreFileBackup, localIgnorePath);
                document.getElementById('ignoreFile').value = fs.readFileSync(localIgnorePath, 'utf8');
            }

            // Sync back to SSH server if needed
            if (isSsh) {
                await sshPut(repoFolder, '.gitignore');
            }

            // Update displayed .gitignore in settings window
            if (opener && opener.document && opener.document.getElementById('gitignoreText')) {
                opener.document.getElementById('gitignoreText').innerText = document.getElementById('ignoreFile').value;
            }

            // Reset index 
            await simpleGit(repoFolder).reset([], (err, result) => {
                if (err) console.warn('Error in git reset():', err);
            });

            await displayIgnoreList();
        } catch (err) {
            console.error('Error in resetGitIgnore():', err);
        }
    }

    async function close(){              // Save .gitignore and remove backup
        console.log('SAVE gitignore file');
        
        try {      
            await save();
            if (fs.existsSync(ignoreFileBackup)) {
                fs.unlinkSync(ignoreFileBackup);
            }
        } catch(err) {
            console.warn('Error closing/saving gitignore:', err);
        }
        
        // Delete MacOS menu
        try {
            if (opener && opener.opener && typeof opener.opener.updateWindowMenu === 'function') {
                opener.opener.updateWindowMenu('Git-ignore Editor');
            }
        } catch (e) {}

        localState.gitignoreWindow = false;
    }
    
    async function save(){
        if (!localIgnorePath) return;

        let content = document.getElementById('ignoreFile').value;

        // Save locally to localIgnorePath
        try {
            fs.writeFileSync(localIgnorePath, content, 'utf8');
        } catch (err) {
            console.warn("Error writing to file : " + localIgnorePath, err);
        }

        // If SSH, upload updated temp file to remote repo
        if (isSsh) {
            try {
                await sshPut(repoFolder, '.gitignore');
            } catch (sshErr) {
                console.warn('Error uploading .gitignore over SSH:', sshErr);
            }
        }

        // Update settings window display text
        try {
            if (opener && opener.document && opener.document.getElementById('gitignoreText')) {
                opener.document.getElementById('gitignoreText').innerText = content;
            }
        } catch (e) {}
    }

    async function retrackGitIndex() {  // Apply button -- Retracks indexed files and preview
        // Save .gitignore locally and on server
        await save();
    
        // Display .ignore file 
        try {
            document.getElementById('ignoreFile').value = fs.readFileSync(localIgnorePath, 'utf8');
        } catch (e) {}
        
        // Clean index :  git rm -rf --cached .  
        try{      
            await simpleGit(repoFolder).raw(['rm', '-r', '-f', '--cached', '.'], (err, result) => {
                if (err) {
                    console.log("Error : git rm -rf --cached . \n" , err);
                } else {
                    console.log("Success  : git rm -rf --cached . \n", result);
                }
            });
        } catch(err){}
        
        document.getElementById('spinner').style.visibility = 'visible';
        
        // Add all files to index :  git add . 
        try{   
            await simpleGit(repoFolder).add('.', (err, result) => {
                document.getElementById('spinner').style.visibility = 'collapse';
                if (err) {
                    console.log("Error : git add . \n" , err);
                } else {
                    console.log("Success  : git add . \n", result);
                }
            });   
        } catch(err){
            document.getElementById('spinner').style.visibility = 'collapse';
        }
        
        await displayIgnoreList();
    }     

    async function displayIgnoreList(){  // Preview ignored files
        if (opener && opener.document && opener.document.getElementById('gitignoreText')) {
            opener.document.getElementById('gitignoreText').innerText = document.getElementById('ignoreFile').value;
        }

        let status = "";
        try {
            await simpleGit(repoFolder).raw(['status', '--porcelain=v1', '--ignored'], (err, result) => {  
                status = result || '';
            });
        } catch (e) {
            status = '';
        }
        
        let splitted = status.split('\n');
        
        // Find modified files
        let modified = '';
        let html = '';
        for(let row = 0; row < splitted.length; row++) {
            if ( !splitted[row].startsWith('!!') ){
                
                // Differentiate between 'deleted'. and 'deleted from tracking'
                if ( splitted[row].startsWith('D') ){
                    try {
                        let fileName = splitted[row].substring(3); 
                        let sep = isSsh ? '/' : pathsep;
                        let filePath = repoFolder + sep + fileName;
                        let exists = await fs_existsSync(filePath, repoKey);
                        if (exists) {
                            // file exists, must be deleted from tracking
                            modified += splitted[row].substring(3) + '(untracked) \n';
                        } else {
                            modified += splitted[row].substring(3) + '(deleted) \n';
                        }
                    } catch(err) {
                        console.error(err);
                    }
                } else {
                    modified += splitted[row].substring(3) + '\n';
                }
            }
        }
        
        html += '<h3> Currently modified files : </h3>';
        html += '<pre>' + modified + '</pre>';
        
        // Find ignored
        let ignored = '';
        for(let row = 0; row < splitted.length; row++) {
            if ( splitted[row].startsWith('!!') ){
                ignored += splitted[row].substring(3) + '\n';
            }
        }
        
        html += '<h3> Ignored list : </h3>';
        html += '<pre>' + ignored + '</pre>';
                    
        document.getElementById('ignoredList').innerHTML = html; 
    }
    
    // TODO:
    // - close-window function (call save and then close window)
    // - remove save button
    // - help
    // - add tab in settings.html to call this window
    // - scroll bar for preview (as in textarea above -- see long example in Dicom2usb repo)

</script>
    
</html>
