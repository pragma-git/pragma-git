<html>
    <!-- 
    This is the GUI shown when GIT or SSH asks for password through ASKPASS-helper (script "pragma-askpass")
    
    This was initially made for GIT,
    but has been adjusted for SSH.  
    This history is reflected in variable names, and code.
    
    Example useage (requires pragma-git to be running) :

    export SSH_ASKPASS="/Users/jan/Documents/Projects/Pragma-git/pragma-git/pragma-askpass"
    export SSH_ASKPASS_REQUIRE=force
    ssh test@home-jan-ubuntu
    
    Example just testing the dialog
    
    
    --> 
    <head>
        <title>Credentials</title>
    
        <link rel="stylesheet" type="text/css" href="../color_styles.css" />
        
        <style>
            body{
                font-family: Arial;
                font-size: 11pt;
                background: var(--body-background);
                color: var(--body-text);
            }
            
            textarea{ 
                width: 100%;
                line-height: 1;
                color: var(--body-text);
                border-width: thin;
                background-color: var(--input-background);
            }
            
            
            select{ 
                width: 100%;
                line-height: 1;
                color: var(--body-text);
                border-width: thin;
                background-color: var(--input-background);
            }
        
        </style>
    </head>
    
<body class='light'>
    <!-- Dark mode on/off --> 

    <script>
        if (typeof opener !== 'undefined' && opener && opener.localState && opener.localState.dark){
            document.body.classList.remove('light');
            document.body.classList.add('dark');
        }
    </script>


        <div id="outerContent"  style="width: fit-content;padding: 10px">
            
            
        <!-- Help button --> 
        <img id="about-icon" style='vertical-align:middle;position: absolute; right: 10px; ' height="17" width="17"  
            onclick="let evt = {}; evt.name='Credentials';opener._callback('help',evt);" 
            onmouseover="document.getElementById('about-icon').src='../images/questionmark_hover.png' " 
            onmouseout="document.getElementById('about-icon').src='../images/questionmark_black.png' " 
            src="../images/questionmark_black.png" >
            
        
        <!-- Text field -->       
            
                    
            <style>
              .input-container {
                display: flex;         /* Ändrat från inline-flex till flex */
                align-items: flex-start; 
                margin-bottom: 10px;   /* Ger lite luft till texten under */
              }
            
              #pwd {
                padding-right: 10px;
                /* Ändra till 'both' eller 'vertical' för att tillåta dragning */
                resize: both; 
                overflow: auto;
                font-family: 'Verdana', sans-serif;
                min-width: 100px;
                min-height: 30px;
              }
            
              #pwd.masked {
                -webkit-text-security: disc;
                letter-spacing: 2px;
              }
            
              .eye-icon {
                width: 20px;
                height: 20px;
                cursor: pointer;
                margin-left: 8px;
                margin-top: 5px; /* Justera så ikonen ligger snyggt vid första raden */
                opacity: 0.6;
              }
            </style>
            
            <label id="pwdlabel" for="pwd">Access Token / Password</label><br>
            <div class="input-container">
                <textarea id="pwd" class="masked" rows="1" cols="50"></textarea>
                <img id="toggleBtn" src="../images/eye-off.svg" class="eye-icon" alt="Visa/Dölj">
            </div>
            
            <div id="matchedRepoRange" style="display:none; margin-bottom: 10px; font-size: 0.85em; user-select: none;">
                <span>Stored token: </span>
                <span id="matchedRepoDown" style="font-weight: bold; padding: 0 4px; user-select: none;" title="Previous token">&#x25C0;</span>
                <span id="matchedCurrentPos" style="font-weight: bold;">0</span> of <span id="matchedMax">0</span>
                <span id="matchedRepoUp" style="font-weight: bold; padding: 0 4px; user-select: none;" title="Next token">&#x25B6;</span>
                <span id="matchedRepoSource" style="color: gray; margin-left: 8px;"></span>
            </div>
            
            <div id="descriptiveText" style="font-size: 0.8em"></div><br>
            
            <button id="okButton" onclick="OK_clicked();">OK</button>
            <button onclick="Cancel_clicked();">Cancel</button>
                    
                    
                    
            <script>
                const pwdArea = document.getElementById('pwd');
                const toggleBtn = document.getElementById('toggleBtn');
                
                // NW.js fönster-instans
                const win = (typeof nw !== 'undefined' && nw.Window) ? nw.Window.get() : null;
                
                // 1. Växla visa/dölj (din befintliga kod)
                toggleBtn.addEventListener('click', () => {
                    const isMasked = pwdArea.classList.toggle('masked');
                    toggleBtn.src = isMasked ? '../images/eye-off.svg' : '../images/eye.svg';
                });
                
                // 2. Automatiskt fönster-resize när användaren drar i textarean
                // Vi använder en ResizeObserver för att detektera när elementet ändrar storlek
                if (typeof ResizeObserver !== 'undefined') {
                    const resizeObserver = new ResizeObserver(() => {
                    // NW.js metod för att anpassa fönstret efter dess innehåll (DOM)
                    // Detta gör att fönstret växer om textarean blir större
                    /* win.setMinimumSize(window.outerWidth, window.outerHeight); // Valfritt: hindra fönstret från att bli mindre än innehållet */
                    });
                    
                    resizeObserver.observe(pwdArea);
                }

                // 3. Stored token navigation and input handlers
                const downBtn = document.getElementById('matchedRepoDown');
                const upBtn = document.getElementById('matchedRepoUp');
                if (downBtn) {
                    downBtn.addEventListener('click', () => {
                        if (typeof storedTokenCandidates !== 'undefined' && storedTokenCandidates.length > 1) {
                            selectCandidate(displayedTokenIndex - 1);
                        }
                    });
                }
                if (upBtn) {
                    upBtn.addEventListener('click', () => {
                        if (typeof storedTokenCandidates !== 'undefined' && storedTokenCandidates.length > 1) {
                            selectCandidate(displayedTokenIndex + 1);
                        }
                    });
                }
                pwdArea.addEventListener('input', () => {
                    let sourceEl = document.getElementById('matchedRepoSource');
                    if (sourceEl && typeof storedTokenCandidates !== 'undefined' && storedTokenCandidates.length > 0) {
                        let currentCand = storedTokenCandidates[displayedTokenIndex - 1];
                        if (currentCand && pwdArea.value === currentCand.token) {
                            sourceEl.innerText = currentCand.source ? `(${currentCand.source})` : '';
                        } else {
                            sourceEl.innerText = '(Custom)';
                        }
                    }
                });
                pwdArea.addEventListener('focus', () => {
                    if (typeof storedTokenCandidates !== 'undefined' && storedTokenCandidates.length > 0 && displayedTokenIndex > 0) {
                        let currentCand = storedTokenCandidates[displayedTokenIndex - 1];
                        if (currentCand && pwdArea.value === currentCand.token) {
                            pwdArea.select();
                        }
                    }
                });
            </script>
            
                
     
            <script>
            // Focus the textarea when the page/dialog loads
            window.addEventListener("DOMContentLoaded", () => {    document.getElementById("pwd").focus();});    
                
                
            document.getElementById("pwd").addEventListener("keydown", function(e) {
                if (e.key === "Enter") {
                    e.preventDefault(); // prevents newline in textarea
                    document.getElementById("okButton").click();
                }
            });
            </script> 

        </div>
    </body>
    
    <!--  Init and Functions  --> 
    <script>
        
        var EXITCODE = 1;  // Defaults to fail
         
        var fs = require('fs');
        var os = require('os');
        const pathsep = require('path').sep;  // Os-dependent path separator
        
        const SIGNALDIR = os.homedir() + pathsep + '.Pragma-git'+ pathsep + '.tmp';

        const SIGNALFILE = SIGNALDIR + pathsep + 'pragma-askpass-running';  
        const EXITSIGNALFILE = SIGNALDIR + pathsep + 'exit-pragma-askpass';
        const EXITMESSAGEFILE = SIGNALDIR + pathsep + 'exit-message-pragma-askpass';  // Written to console from pragma-askpass shell script
        
        const ARG1 = loadFile(`${SIGNALDIR}/askpass_first`); // "Username for 'https://github.com/JanAxelssonTest/Remote_branch_test_repo.git':\n"
        
        // Assume git, otherwise correct lower down
        [type, , url] = ARG1.split(' ');    // 'Username'  'for'  "'https://github.com/JanAxelssonTest/Remote_branch_test_repo.git':"  "\n"
        url = url ? url.split("'")[1] : '';    // ['', 'https://pragma-git@github.com/pragma-git2/pragma-git.git', ':']
        
        var isPassword = false;
        var storedTokenCandidates = [];
        var displayedTokenIndex = 0;

        function adjustWindowSize() {
            try {
                if (typeof nw === 'undefined' || !nw.Window) return;
                let outer = document.getElementById('outerContent');
                if (!outer) return;
                let padding = Number(outer.style.padding.replace('px', '')) || 10;
                let dx = outer.scrollWidth;
                let dy = outer.scrollHeight;
                let hx = window.outerWidth - window.innerWidth;
                let hy = window.outerHeight - window.innerHeight;
                window.resizeTo(dx + hx + 2 * padding, dy + hy + padding + 16);
            } catch (e) {}
        }

        function selectCandidate(newIndex) {
            if (!storedTokenCandidates || storedTokenCandidates.length === 0) return;
            if (newIndex < 1) newIndex = storedTokenCandidates.length;
            if (newIndex > storedTokenCandidates.length) newIndex = 1;
            displayedTokenIndex = newIndex;
            let cand = storedTokenCandidates[displayedTokenIndex - 1];
            let pwd = document.getElementById('pwd');
            if (pwd && cand) {
                pwd.value = cand.token;
                pwd.select();
            }
            let posEl = document.getElementById('matchedCurrentPos');
            if (posEl) posEl.innerText = displayedTokenIndex;
            let maxEl = document.getElementById('matchedMax');
            if (maxEl) maxEl.innerText = storedTokenCandidates.length;
            let sourceEl = document.getElementById('matchedRepoSource');
            if (sourceEl) {
                sourceEl.innerText = cand.source ? `(${cand.source})` : '';
            }
        }

        async function loadStoredTokensForUrl(targetUrl) {
            let candidates = [];
            if (!targetUrl || typeof targetUrl !== 'string' || !targetUrl.startsWith('http')) {
                return candidates;
            }
            if (typeof opener === 'undefined' || !opener) {
                return candidates;
            }

            let parsedUrl;
            try {
                parsedUrl = new URL(targetUrl.trim());
            } catch (e) {
                return candidates;
            }

            let protocol = parsedUrl.protocol;
            let host = parsedUrl.host;
            let pathSegments = parsedUrl.pathname.split('/').filter(Boolean);
            let account = pathSegments.length > 0 ? pathSegments[0] : (parsedUrl.username || '');
            if (!account) {
                return candidates;
            }

            let seenTokens = new Set();
            let queriedUrls = new Set();

            // 1. Account-level credential (e.g. https://github.com/JanAxelsson)
            let accountUrl = `${protocol}//${host}/${account}`;
            if (typeof opener.getCredential === 'function') {
                try {
                    queriedUrls.add(accountUrl.toLowerCase());
                    let acctCred = await opener.getCredential(accountUrl);
                    if (acctCred && acctCred.password) {
                        let token = acctCred.password;
                        if (token && !seenTokens.has(token)) {
                            seenTokens.add(token);
                            candidates.push({
                                token: token,
                                source: 'Account default',
                                url: accountUrl
                            });
                        }
                    }
                } catch (e) {}
            }

            // 2. Exact repo credential (if distinct from account URL)
            let cleanRepoUrl = `${protocol}//${host}/${pathSegments.join('/')}`;
            if (cleanRepoUrl.toLowerCase() !== accountUrl.toLowerCase() && typeof opener.getCredential === 'function') {
                try {
                    queriedUrls.add(cleanRepoUrl.toLowerCase());
                    let repoCred = await opener.getCredential(targetUrl);
                    if (repoCred && repoCred.password) {
                        let token = repoCred.password;
                        if (token && !seenTokens.has(token)) {
                            seenTokens.add(token);
                            let label = pathSegments.length > 1 ? pathSegments.slice(0, 2).join('/').replace(/\.git$/i, '') : 'This repo';
                            candidates.push({
                                token: token,
                                source: label,
                                url: cleanRepoUrl
                            });
                        }
                    }
                } catch (e) {}
            }

            // 3. Other repos belonging to this account in opener.state.repos
            if (opener.state && Array.isArray(opener.state.repos) && typeof opener.getCredential === 'function') {
                for (let repo of opener.state.repos) {
                    if (!repo || !repo.remoteURL || typeof repo.remoteURL !== 'string' || !repo.remoteURL.startsWith('http')) {
                        continue;
                    }
                    try {
                        let rUrl = new URL(repo.remoteURL.trim());
                        if (rUrl.host.toLowerCase() === host.toLowerCase()) {
                            let rPathParts = rUrl.pathname.split('/').filter(Boolean);
                            if (rPathParts.length > 0 && rPathParts[0].toLowerCase() === account.toLowerCase()) {
                                let cleanRUrl = `${rUrl.protocol}//${rUrl.host}/${rPathParts.join('/')}`.toLowerCase();
                                if (queriedUrls.has(cleanRUrl)) continue;
                                queriedUrls.add(cleanRUrl);

                                let cred = await opener.getCredential(repo.remoteURL);
                                if (cred && cred.password) {
                                    let token = cred.password;
                                    if (token && !seenTokens.has(token)) {
                                        seenTokens.add(token);
                                        let label = rPathParts.length > 1 ? `${rPathParts[0]}/${rPathParts[1].replace(/\.git$/i, '')}` : (repo.localFolder ? repo.localFolder.split('/').pop() : rPathParts[0]);
                                        candidates.push({
                                            token: token,
                                            source: label,
                                            url: repo.remoteURL
                                        });
                                    }
                                }
                            }
                        }
                    } catch (e) {}
                }
            }

            return candidates;
        }

        //
        // GIT USERNAME DIALOG 
        //
        if ( ARG1.startsWith('Username') ){
            document.getElementById('pwdlabel').innerHTML= 'Username / Account name <br>';	
            document.getElementById('descriptiveText').innerHTML= '(for repository : "' + url + '" )';


             <!-- Git provider -- guess userName -->
             
            async function getUsername(){
                try{ 
                    global.log(`askpass, url =  ${url}`)
                    let provider = await opener.gitProvider(url);
                    global.log(`askpass, provider =  ${provider}`)
                    let userName = await provider.getValue('git-username');
                    document.getElementById('pwd').value = userName;
                }catch (err){
                    global.log(err)
                    // unknown provider
                }
            }
            getUsername()
        }

        //
        // GIT PASSWORD DIALOG 
        //
        if ( ARG1.startsWith('Password') ){
            if (typeof nw !== 'undefined' && nw.Window) {
                nw.Window.get().show();
            }
            document.getElementById('pwdlabel').innerHTML = 'Access Token / Password <br>';	
            document.getElementById('descriptiveText').innerHTML= '(for repository : "' + url + '" )';
            
            isPassword = true;

            if (url && url.startsWith('http')) {
                loadStoredTokensForUrl(url).then(cands => {
                    storedTokenCandidates = cands || [];
                    if (storedTokenCandidates.length > 0) {
                        let rangeEl = document.getElementById('matchedRepoRange');
                        let downBtn = document.getElementById('matchedRepoDown');
                        let upBtn = document.getElementById('matchedRepoUp');
                        if (rangeEl) rangeEl.style.display = 'block';
                        if (downBtn && upBtn) {
                            if (storedTokenCandidates.length > 1) {
                                downBtn.style.cursor = 'pointer';
                                downBtn.style.opacity = '1';
                                upBtn.style.cursor = 'pointer';
                                upBtn.style.opacity = '1';
                            } else {
                                downBtn.style.cursor = 'default';
                                downBtn.style.opacity = '0.3';
                                upBtn.style.cursor = 'default';
                                upBtn.style.opacity = '0.3';
                            }
                        }
                        selectCandidate(1);
                        adjustWindowSize();
                    }
                }).catch(err => {
                    if (typeof global !== 'undefined' && global.log) {
                        global.log(err);
                    }
                });
            }
        }
        
        //
        // SSH  PASSWORD DIALOG
        //
            // True if prompt looks like: jan@192.168.2.213's password:const isSshPassword = /.+@.+\'s password:$/.test(prompt);
            const prompt = ( ARG1 || "").trim();
            const isSshPassword = prompt.toLowerCase().includes("password:"); 

            if (isSshPassword){
                if (typeof nw !== 'undefined' && nw.Window) {
                    nw.Window.get().show();
                }
                
                url = ARG1.split(' ')[0].split("'")[0]; // "jan@192.168.2.213's password: \n"  => url = jan@192.168.2.213
                document.getElementById('pwdlabel').innerHTML = 'SSH Password <br>';
                document.getElementById('descriptiveText').innerHTML= '(for  : "' + url + '" )';
                
                isPassword = true;
            } 
        
        //
        // SSH  FINGERPRINT DIALOG
        //

            if ( ARG1.includes('fingerprint') ){
                console.log('fingerprint dialog');
                
                if (typeof nw !== 'undefined' && nw.Window) {
                    nw.Window.get().show();
                }
                document.getElementById('pwdlabel').innerHTML = `${ ARG1.replaceAll('\n','<br><br>') } <br>`;
                document.getElementById('descriptiveText').innerHTML= '(Type yes / no in textarea above)';
            }            
            
         
         //
         // Make it a non-password dialog
         //   
         if ( !isPassword ){
             toggleBtn.style.visibility = 'hidden';
             pwdArea.classList.toggle('masked');
         }
            

        //
        // CALLBACKS 
        //
        function OK_clicked(){
            let message = document.getElementById('pwd').value;
            
            ExitMessage( message); 
            EXITCODE = 0;
            if (typeof nw !== 'undefined' && nw.Window) {
                nw.Window.get().close(); //See nwjs issue #7808
            }
        }   
        
        
        function Cancel_clicked(){
            EXITCODE = 1;
            if (typeof nw !== 'undefined' && nw.Window) {
                nw.Window.get().close(); //See nwjs issue #7808
            }
        }
         

        //
        // UTILITY FUNCTIONS 
        //        
        function ExitMessage( message){
         
            try{
                fs.writeFileSync(EXITMESSAGEFILE,message,'utf8'); // Exit code as string
            }catch(err){
                console.log('FAILED SAVING EXIT MESSAGE TO FILE = ' + EXITMESSAGEFILE);
                console.log(err);
                fs.writeFileSync(EXITMESSAGEFILE,'FAILED SAVING EXIT MESSAGE TO FILE','utf8');// Special message if failed
            }
        }       
        
        
        function Exit( exitCode){
            
            let exitCodeString = parseInt( exitCode, 10).toString();
            //opener.pragmaLog( `ASKPASS EXIT CODE = ${exitCodeString}`)

         
            try{
                fs.writeFileSync(EXITSIGNALFILE,exitCodeString,'utf8'); // Exit code as string
            }catch(err){
                console.log('FAILED SAVING EXIT CODE TO FILE = ' + EXITSIGNALFILE);
                console.log(err);
                fs.writeFileSync(EXITSIGNALFILE,2,'utf8');// Special exit code if failed
            }
            
            // Remove file, to let script know it has stopped
            try {
                fs.unlinkSync(SIGNALFILE)
            
            } catch(err) {
                console.error(err)
            }
            if (typeof nw !== 'undefined' && nw.Window) {
                nw.Window.get().close(); //See nwjs issue #7808
            }
        }

 
        function loadFile(filePath)  { 
            let content = "";
            try{
                content = fs.readFileSync(filePath,'utf8');
            }catch(err){
                
            }
            
            return content;
        } 
   
 
    </script>  
    
       
    <!-- Close Event  --> 
    <script>

        window.addEventListener(
            'beforeunload', 
            (event) => { Exit( EXITCODE); }
            
        );
    </script>


    <script>
            
        // Set size to match content
        adjustWindowSize();
        
        // Set ontop
        if (typeof nw !== 'undefined' && nw.Window) {
            nw.Window.get().setAlwaysOnTop( true );
        }
       
    </script>
    
</html>
