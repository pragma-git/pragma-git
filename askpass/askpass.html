<html>
    <!-- 
    This is the GUI shown when GIT or SSH asks for password through ASKPASS-helper (script "pragma-askpass")
    
    This was initially made for GIT,
    but has been adjusted for SSH.  
    This history is reflected in variable names, and code.
    
    Example useage (requires pragma-git to be running) :

    export SSH_ASKPASS="/Users/jan/Documents/Projects/Pragma-git/pragma-git/pragma-askpass"
    export SSH_ASKPASS_REQUIRE=force
    ssh test@home-jan-ubuntu
    
    Example just testing the dialog
    
    
    --> 
    <head>
        <title>Credentials</title>
    
        <link rel="stylesheet" type="text/css" href="../color_styles.css" />
        
        <style>
            body{
                font-family: Arial;
                font-size: 11pt;
                background: var(--body-background);
                color: var(--body-text);
            }
            
            textarea{ 
                width: 100%;
                line-height: 1;
                color: var(--body-text);
                border-width: thin;
                background-color: var(--input-background);
            }
            
            
            select{ 
                width: 100%;
                line-height: 1;
                color: var(--body-text);
                border-width: thin;
                background-color: var(--input-background);
            }
        
        </style>
    </head>
    
<body class='light'>
    <!-- Dark mode on/off --> 

    <script>
        if (opener.localState.dark){
            document.body.classList.remove('light');
            document.body.classList.add('dark');
        }
    </script>


        <div id="outerContent"  style="width: fit-content;padding: 10px">
            
            
        <!-- Help button --> 
        <img id="about-icon" style='vertical-align:middle;position: absolute; right: 10px; ' height="17" width="17"  
            onclick="let evt = {}; evt.name='Credentials';opener._callback('help',evt);" 
            onmouseover="document.getElementById('about-icon').src='../images/questionmark_hover.png' " 
            onmouseout="document.getElementById('about-icon').src='../images/questionmark_black.png' " 
            src="../images/questionmark_black.png" >
            
        
        <!-- Text field -->       
        <label id="pwdlabel" for="pwd">Access Token / Password</label><br><br>
        <textarea id="pwd" rows="1" cols="50"></textarea><br><br>
        
        <div id="descriptiveText" style="font-size: 0.8em"></div><br>
        
        <button id="okButton" onclick="OK_clicked();">OK</button>
        <button onclick="Cancel_clicked();">Cancel</button>
        
        <script>
        // Focus the textarea when the page/dialog loads
        window.addEventListener("DOMContentLoaded", () => {    document.getElementById("pwd").focus();});    
            
            
        document.getElementById("pwd").addEventListener("keydown", function(e) {
            if (e.key === "Enter") {
                e.preventDefault(); // prevents newline in textarea
                document.getElementById("okButton").click();
            }
        });
        </script> 
        </div>
    </body>
    
    <!--  Init and Functions  --> 
    <script>
        
        var EXITCODE = 1;  // Defaults to fail
         
        var fs = require('fs');
        var os = require('os');
        const pathsep = require('path').sep;  // Os-dependent path separator
        
        const SIGNALDIR = os.homedir() + pathsep + '.Pragma-git'+ pathsep + '.tmp';

        const SIGNALFILE = SIGNALDIR + pathsep + 'pragma-askpass-running';  
        const EXITSIGNALFILE = SIGNALDIR + pathsep + 'exit-pragma-askpass';
        const EXITMESSAGEFILE = SIGNALDIR + pathsep + 'exit-message-pragma-askpass';  // Written to console from pragma-askpass shell script
        
        const ARG1 = loadFile(`${SIGNALDIR}/askpass_first`); // "Username for 'https://github.com/JanAxelssonTest/Remote_branch_test_repo.git':\n"
        
        // Assume git, otherwise correct lower down
        [type, , url] = ARG1.split(' ');    // 'Username'  'for'  "'https://github.com/JanAxelssonTest/Remote_branch_test_repo.git':"  "\n"
        url = url.split("'")[1];    // ['', 'https://pragma-git@github.com/pragma-git2/pragma-git.git', ':']


        //
        // GIT USERNAME DIALOG 
        //
        if ( ARG1.startsWith('Username') ){
            document.getElementById('pwdlabel').innerHTML= 'Username / Account name <br>';	
            document.getElementById('descriptiveText').innerHTML= '(for repository : "' + url + '" )';


             <!-- Git provider -- guess userName -->
             
            async function getUsername(){
                try{ 
                    global.log(`askpass, url =  ${url}`)
                    let provider = await opener.gitProvider(url);
                    global.log(`askpass, provider =  ${provider}`)
                    let userName = await provider.getValue('git-username');
                    document.getElementById('pwd').value = userName;
                }catch (err){
                    global.log(err)
                    // unknown provider
                }
            }
            getUsername()
        }

        //
        // GIT PASSWORD DIALOG 
        //
        if ( ARG1.startsWith('Password') ){
			nw.Window.get().show();
            document.getElementById('pwdlabel').innerHTML = 'Access Token / Password <br>';	
            document.getElementById('descriptiveText').innerHTML= '(for repository : "' + url + '" )';
        }
        
        //
        // SSH  PASSWORD DIALOG
        //
            // True if prompt looks like: jan@192.168.2.213's password:const isSshPassword = /.+@.+\'s password:$/.test(prompt);
            const prompt = ( ARG1 || "").trim();
            const isSshPassword = prompt.toLowerCase().includes("password:"); 

            if (isSshPassword){
                nw.Window.get().show();
                
                url = ARG1.split(' ')[0].split("'")[0]; // "jan@192.168.2.213's password: \n"  => url = jan@192.168.2.213
                document.getElementById('pwdlabel').innerHTML = 'SSH Password <br>';
                document.getElementById('descriptiveText').innerHTML= '(for  : "' + url + '" )';
                
            } 
        
        //
        // SSH  FINGERPRINT DIALOG
        //

            if ( ARG1.includes('fingerprint') ){
                console.log('fingerprint dialog');
                
                nw.Window.get().show();
                document.getElementById('pwdlabel').innerHTML = `${ ARG1.replaceAll('\n','<br><br>') } <br>`;
                document.getElementById('descriptiveText').innerHTML= '(Type yes / no in textarea above)';
            }            
            
            
            

        //
        // CALLBACKS 
        //
        function OK_clicked(){
            let message = document.getElementById('pwd').value;
            
            ExitMessage( message); 
            EXITCODE = 0;
            nw.Window.get().close(); //See nwjs issue #7808
        }   
        
        
        function Cancel_clicked(){
            EXITCODE = 1;
            nw.Window.get().close(); //See nwjs issue #7808
        }
         

        //
        // UTILITY FUNCTIONS 
        //        
        function ExitMessage( message){
         
            try{
                fs.writeFileSync(EXITMESSAGEFILE,message,'utf8'); // Exit code as string
            }catch(err){
                console.log('FAILED SAVING EXIT MESSAGE TO FILE = ' + EXITMESSAGEFILE);
                console.log(err);
                fs.writeFileSync(EXITMESSAGEFILE,'FAILED SAVING EXIT MESSAGE TO FILE','utf8');// Special message if failed
            }
        }       
        
        
        function Exit( exitCode){
            
            let exitCodeString = parseInt( exitCode, 10).toString();
            //opener.pragmaLog( `ASKPASS EXIT CODE = ${exitCodeString}`)

         
            try{
                fs.writeFileSync(EXITSIGNALFILE,exitCodeString,'utf8'); // Exit code as string
            }catch(err){
                console.log('FAILED SAVING EXIT CODE TO FILE = ' + EXITSIGNALFILE);
                console.log(err);
                fs.writeFileSync(EXITSIGNALFILE,2,'utf8');// Special exit code if failed
            }
            
            // Remove file, to let script know it has stopped
            try {
                fs.unlinkSync(SIGNALFILE)
            
            } catch(err) {
                console.error(err)
            }
            nw.Window.get().close(); //See nwjs issue #7808
        }

 
        function loadFile(filePath)  { 
            let content = "";
            try{
                content = fs.readFileSync(filePath,'utf8');
            }catch(err){
                
            }
            
            return content;
        } 
   
 
    </script>  
    
       
    <!-- Close Event  --> 
    <script>

        window.addEventListener(
            'beforeunload', 
            (event) => { Exit( EXITCODE); }
            
        );
    </script>


    <script>
            
        // Set size to match content
        let padding = Number(document.getElementById('outerContent').style.padding.replace('px','') );
        let dx = document.getElementById('outerContent').scrollWidth;
        let dy = document.getElementById('outerContent').scrollHeight;
        
        let hx = window.outerWidth - window.innerWidth;
        let hy = window.outerHeight - window.innerHeight;
        window.resizeTo(dx + hx + 2 * padding , dy + hy + padding + 16);
        
        // Set ontop
        nw.Window.get().setAlwaysOnTop( true );
       
    </script>
    
</html>
