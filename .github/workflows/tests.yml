name: Automated Test Suites

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

env:
  FORCE_COLOR: '1'
  TERM: 'xterm-256color'
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash

    steps:
      - name: Configure Git Line Endings (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Read NW.js Version from package.json
        id: nw-version
        run: |
          NW_VER=$(node -p "require('./package.json').nwVersion")
          echo "NW_VERSION=$NW_VER" >> "$GITHUB_ENV"
          echo "version=$NW_VER" >> "$GITHUB_OUTPUT"

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends openssh-server libsecret-1-0 gnome-keyring dbus-x11 xvfb || \
            (sudo apt-get update && sudo apt-get install -y --no-install-recommends openssh-server libsecret-1-0 gnome-keyring dbus-x11 xvfb)
          sudo systemctl start ssh

      - name: Set up WSL (Windows)
        if: runner.os == 'Windows'
        uses: Vampire/setup-wsl@v7
        with:
          distribution: Ubuntu-22.04
          use-cache: true
          additional-packages: |
            openssh-server
            git
            curl

      - name: Cache NW.js Binary
        id: cache-nwjs
        uses: actions/cache@v4
        with:
          path: ~/nwjs_cache
          key: nwjs-${{ runner.os }}-${{ steps.nw-version.outputs.version }}

      - name: Install NW.js Binary
        run: |
          mkdir -p ~/nwjs_cache
          cd ~/nwjs_cache
          if [ "${{ runner.os }}" = "macOS" ]; then
            if [ ! -d "nwjs-v${NW_VERSION}-osx-x64/nwjs.app" ]; then
              curl -sSL -A "Mozilla/5.0" -o nwjs.zip "https://dl.nwjs.io/v${NW_VERSION}/nwjs-v${NW_VERSION}-osx-x64.zip"
              unzip -q nwjs.zip
              rm -f nwjs.zip
            fi
            sudo cp -R "nwjs-v${NW_VERSION}-osx-x64/nwjs.app" /Applications/
            echo "NW_BIN=/Applications/nwjs.app/Contents/MacOS/nwjs" >> "$GITHUB_ENV"
          elif [ "${{ runner.os }}" = "Linux" ]; then
            if [ ! -f "nwjs-v${NW_VERSION}-linux-x64/nw" ]; then
              curl -sSL -A "Mozilla/5.0" -o nwjs.tar.gz "https://dl.nwjs.io/v${NW_VERSION}/nwjs-v${NW_VERSION}-linux-x64.tar.gz"
              tar -xzf nwjs.tar.gz
              rm -f nwjs.tar.gz
            fi
            sudo ln -sf "$PWD/nwjs-v${NW_VERSION}-linux-x64/nw" /usr/local/bin/nw
            echo "NW_BIN=$PWD/nwjs-v${NW_VERSION}-linux-x64/nw" >> "$GITHUB_ENV"
          elif [ "${{ runner.os }}" = "Windows" ]; then
            if [ ! -f "nwjs-v${NW_VERSION}-win-x64/nw.exe" ]; then
              curl -sSL -A "Mozilla/5.0" -o nwjs.zip "https://dl.nwjs.io/v${NW_VERSION}/nwjs-v${NW_VERSION}-win-x64.zip"
              unzip -q nwjs.zip
              rm -f nwjs.zip
            fi
            echo "$PWD/nwjs-v${NW_VERSION}-win-x64" >> "$GITHUB_PATH"
            echo "NW_BIN=$PWD/nwjs-v${NW_VERSION}-win-x64/nw.exe" >> "$GITHUB_ENV"
          fi

      - name: Configure Localhost SSH
        run: |
          mkdir -p ~/.ssh ~/.Pragma-git/.tmp /tmp/pragma-git-ssh-folders
          chmod 700 ~/.ssh
          ssh-keygen -t ed25519 -f ~/.ssh/id_ed25519 -N ""
          cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          cat << 'EOF' > ~/.ssh/config
          Host localhost 127.0.0.1
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            LogLevel ERROR
          EOF
          chmod 600 ~/.ssh/config
          if [ "${{ runner.os }}" = "macOS" ]; then
            sudo systemsetup -setremotelogin on 2>/dev/null || true
          fi

      - name: Configure WSL OpenSSH Service (Linux SSH Target)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Stop-Service sshd -ErrorAction SilentlyContinue
          Set-Service -Name sshd -StartupType Disabled -ErrorAction SilentlyContinue
          $drive = $PWD.Drive.Name.ToLower()
          $rest = $PWD.Path.Substring(2).Replace('\', '/')
          $wslRepo = "/mnt/$drive$rest"
          wsl bash "$wslRepo/automated-tests/setup_wsl_ssh.sh" $env:USERNAME
          Start-Process wsl -ArgumentList "sleep","infinity" -WindowStyle Hidden

      - name: Configure Git Author
        run: |
          git config --global user.name "Pragma-git CI"
          git config --global user.email "ci@pragma-git.local"

      - name: Install NPM Dependencies
        run: npm install

      - name: Run Automated Test Suites (macOS)
        if: runner.os == 'macOS'
        run: npm test -- -v

      - name: Run Automated Test Suites (Linux with D-Bus and Xvfb)
        if: runner.os == 'Linux'
        run: |
          eval $(dbus-launch --sh-syntax)
          echo "" | gnome-keyring-daemon --unlock || true
          xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" npm test -- -v

      - name: Run Automated Test Suites (Windows)
        if: runner.os == 'Windows'
        run: |
          wsl -u root service ssh restart || true
          bash ./_run_tests -v
